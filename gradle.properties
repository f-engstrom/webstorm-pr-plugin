group = se.personal.adoprreview
version = 0.1.0

# WebStorm 2026.2 is the build target and also provides the JDK 25 toolchain (its bundled JBR).
platformLocalPath = /Applications/WebStorm.app
org.gradle.java.installations.paths = /Applications/WebStorm.app/Contents/jbr/Contents/Home

# kotlinx.coroutines and kotlinx.serialization come from the platform, so don't bundle the stdlib either.
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
